server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 — server 블록에 두면 하위 location이 상속한다.
    # ⚠️ nginx의 add_header는 상속이 "합쳐지는" 게 아니라 **덮어쓰기**다 — 어느 location에서든
    #    add_header를 하나라도 쓰면 여기 있는 것들이 그 location에서 통째로 사라진다.
    #    location에 헤더를 추가해야 하면 이 목록도 함께 복사해야 한다.
    # `always`를 붙이는 이유: 없으면 2xx/3xx에만 붙고 4xx·5xx 응답에는 빠진다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP — 실제로 쓰는 출처만 연다.
    #   외부 폰트 호스트는 **두 곳에서** 온다 — 한쪽만 보면 놓친다.
    #     · styles/index.css 최상단의 @import 4개
    #       (jsdelivr = Pretendard·Wanted Sans, googleapis/gstatic = JetBrains Mono·Space Grotesk)
    #     · styles/landing.css의 @font-face (cdn.fontshare.com = General Sans, 랜딩·약관 본문 서체)
    #     @import만 grep하면 후자를 놓친다 — 실제로 놓쳐서 랜딩 본문이 폴백 서체로 떨어졌다.
    #     앱 화면은 Pretendard라 멀쩡해 보이므로 **랜딩·약관 페이지로 확인해야 한다.**
    #     폰트를 self-host로 바꾸면 이 세 호스트를 전부 지울 수 있다.
    #   style-src의 'unsafe-inline'은 컴포넌트의 style={{...}} 때문에 필요하다(현재 23개 파일).
    #   script-src에 'unsafe-inline'이 없는 것이 핵심이다 — 빌드 산출물에 인라인 <script>가
    #     없어서(빌드 확인) XSS의 주 경로를 막는다.
    #   img/media가 'self'인 이유: 로고·히어로 영상이 전부 public/에 있고 외부 이미지는 쓰지 않는다
    #     (프로필 사진도 이니셜로 그린다).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdn.fontshare.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # webhook만 pipeline-worker로. prefix를 좁게 잡아 같은 서비스의 인증 없는
    # /api/v1/collect, /api/v1/raw 는 외부에 노출되지 않게 한다.
    # nginx는 가장 긴 prefix가 이기므로 아래 /api/ 보다 우선한다.
    location /api/v1/webhook/ {
        # nginx 기본값은 1MB인데 GitHub webhook 페이로드는 최대 25MB까지 온다(커밋이 많은 push).
        # 넘으면 413으로 잘리고, 발행 측은 이미 checkpoint를 넘긴 뒤라 그 사이 데이터가
        # 조용히 누락된다 — 수집이 멈춘 줄 모르고 지나가는 종류의 실패다.
        client_max_body_size 25m;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $worker_upstream http://pipeline-worker:8081;
        proxy_pass $worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS는 Cloudflare 엣지에서 끝난다. $scheme는 이 컨테이너가 :80이라 항상 http —
        # 엣지가 준 https를 덮어쓰면 backend가 쿠키에 Secure를 못 붙인다.
        # 헤더가 없으면(로컬) nginx는 빈 값을 업스트림에 안 보낸다 → 실제 scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # /api/* 는 backend 컨테이너로 reverse proxy
    location /api/ {
        # docker 내장 DNS로 backend를 주기적으로 재해석 — backend 재시작으로 IP가 바뀌어도
        # nginx 재시작 없이 따라가게 한다. proxy_pass에 변수를 쓰면 시작 시 1회 캐싱을 피할 수 있음.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS는 Cloudflare 엣지에서 끝난다. $scheme는 이 컨테이너가 :80이라 항상 http —
        # 엣지가 준 https를 덮어쓰면 backend가 쿠키에 Secure를 못 붙인다.
        # 헤더가 없으면(로컬) nginx는 빈 값을 업스트림에 안 보낸다 → 실제 scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback — React Router의 client-side route를 위해 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
