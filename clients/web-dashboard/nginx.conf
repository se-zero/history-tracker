server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* 는 backend 컨테이너로 reverse proxy
    location /api/ {
        # docker 내장 DNS로 backend를 주기적으로 재해석 — backend 재시작으로 IP가 바뀌어도
        # nginx 재시작 없이 따라가게 한다. proxy_pass에 변수를 쓰면 시작 시 1회 캐싱을 피할 수 있음.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — React Router의 client-side route를 위해 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
