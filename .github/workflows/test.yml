# 테스트 워크플로
#
# 머지 전에 4개 서비스의 테스트를 자동으로 돌린다. 이전에는 로컬 훅에만 의존해서,
# 훅이 없는 환경에서 만든 커밋은 아무도 검증하지 않은 채 올라올 수 있었다.
#
# **이 워크플로의 실질 가치는 backend에 있다.** 퍼시스턴스·스키마 테스트가
# `@Testcontainers(disabledWithoutDocker = true)`로 선언돼 있어 Docker가 없으면 조용히
# 건너뛴다(로컬 실측: Docker 꺼짐 641건 실행/91건 스킵 → 켜짐 732건 전량 실행).
# 건너뛰는 91건이 하필 Flyway migration ↔ JPA Entity 정합성을 검증하는 것들이고,
# 이게 어긋나면 `ddl-auto: validate`라 프로덕션이 기동조차 못 한다.
# GitHub 러너에는 Docker가 항상 있으므로 여기서는 무조건 돈다.

name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

# 문서만 바뀐 push도 돌린다 — 리뷰 봇(code-review.yml)은 건너뛰어도 되지만, 테스트는
# "이 커밋에서 초록이었나"가 기록으로 남아야 한다.

# 연달아 push하면 앞 실행을 취소하고 마지막 것만 돌린다 — 단 PR에서만.
# develop·main으로의 push는 취소하지 않는다: 연달아 머지되면 앞 커밋의 실행이 취소돼
# "그 커밋에서 초록이었나"라는 기록이 사라지기 때문이다(위 트리거 주석의 근거와 같다).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 워크플로 기본 permissions(contents: read)를 그대로 쓴다.
    # upload-artifact@v4는 GITHUB_TOKEN이 아니라 러너가 주입하는 ACTIONS_RUNTIME_TOKEN으로
    # 업로드하므로 권한을 넓힐 근거가 없다. 혹시 첫 실패 때 업로드가 안 되면 그때 추가한다.
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Testcontainers가 러너의 Docker로 postgres:16-alpine을 띄운다(러너에 기본 탑재).
      - run: ./gradlew test --no-daemon
      - name: 커버리지 리포트 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: services/backend/build/reports/jacoco/test/
          retention-days: 7
      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: services/backend/build/reports/tests/test
          retention-days: 7

  pipeline-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/pipeline-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew test --no-daemon
      - name: 커버리지 리포트 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-worker-coverage
          path: services/pipeline-worker/build/reports/jacoco/test/
          retention-days: 7
      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-worker-test-report
          path: services/pipeline-worker/build/reports/tests/test
          retention-days: 7

  ai-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-engine/requirements.txt
            services/ai-engine/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest.ini의 testpaths가 tests/unit만 수집한다 — 살아 있는 Neo4j·OpenAI가 필요한
      # integration 테스트는 기본 수집에서 빠져 있어 별도 조치가 필요 없다.
      # 커버리지는 --cov를 붙인 실행에서만 잰다(리포트 형식은 pytest.ini의 addopts).
      - run: pytest --cov
      - name: 커버리지 리포트 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-engine-coverage
          path: |
            services/ai-engine/htmlcov
            services/ai-engine/coverage.xml
          retention-days: 7

  web-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/web-dashboard/package-lock.json
      - run: npm ci
      # 테스트 러너가 없는 서비스라 타입체크와 빌드 성공이 기준선이다
      # (clients/web-dashboard/CLAUDE.md의 검증 명령과 같다).
      - run: npm run typecheck
      - run: npm run build

  # PR에 서비스별 라인 커버리지를 댓글 하나로 남기고, 푸시할 때마다 같은 댓글을 갱신한다
  # (.github/scripts/coverage_comment.py). 병합 화면에서 아티팩트를 받지 않고도 숫자를 보려는 것이다.
  # develop 대비 증감은 넣지 않았다 — 필요해지면 develop 마지막 실행의 아티팩트와 비교한다.
  #
  # 쓰기 권한은 이 잡에만 준다. 위 테스트 잡들은 PR 코드를 실행하므로 읽기 전용으로 두고, 이 잡은
  # 아티팩트의 숫자만 읽는다. 잡마다 러너가 달라 앞 잡의 파일을 직접 볼 수 없어서, 위에서 올린
  # 커버리지 아티팩트를 내려받아 읽는다.
  coverage-comment:
    needs: [backend, pipeline-worker, ai-engine]
    # !cancelled(): 테스트가 실패한 커밋에서도 돌아 "측정하지 못함"으로 갱신한다 — 안 그러면 이전 커밋의
    #   숫자가 남아 현재 커밋의 것처럼 읽힌다. 새 푸시로 이 실행이 취소되면 건너뛴다.
    # 포크 PR은 GITHUB_TOKEN이 읽기 전용이라 댓글을 못 쓰므로 건너뛴다(이 저장소는 같은 저장소 브랜치로 PR을 연다).
    # develop·main push에는 PR이 없어 건너뛴다.
    # `!`로 시작하는 식은 YAML 태그로 읽히므로 ${{ }}로 감싼다.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # 같은 실행 안의 아티팩트는 러너가 주입하는 토큰으로 받으므로 권한을 더 열지 않는다(upload와 같은 방침).
      # 혹시 첫 실행에서 막히면 그때 actions: read를 추가한다.
      # 셋 다 실패해 일치하는 아티팩트가 하나도 없는 경우에도 "측정하지 못함"을 적어야 하므로 실패를 무시한다.
      - name: 커버리지 리포트 내려받기
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "*-coverage"
          path: coverage
      - name: 커버리지 댓글 작성·갱신
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/coverage_comment.py --artifacts-dir coverage
