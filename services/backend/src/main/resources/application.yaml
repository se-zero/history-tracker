spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/history_tracker}
    username: ${DB_USERNAME:history_tracker}
    password: ${DB_PASSWORD:history_tracker}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

ai:
  engine:
    url: http://localhost:8000
