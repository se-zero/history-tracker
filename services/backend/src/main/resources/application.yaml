spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/history_tracker?stringtype=unspecified}
    username: ${DB_USERNAME:history_tracker}
    password: ${DB_PASSWORD:history_tracker}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

ai:
  engine:
    url: http://localhost:8000

security:
  credentials:
    key: ${BACKEND_CREDENTIAL_KEY:bG9jYWwtY3JlZGVudGlhbC1rZXktMzItYnl0ZXMhISE=}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-must-be-changed}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}

github:
  app:
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    installation-url: ${GITHUB_INSTALLATION_URL:}
    authorize-url: ${GITHUB_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
    access-token-url: ${GITHUB_ACCESS_TOKEN_URL:https://github.com/login/oauth/access_token}
    user-url: ${GITHUB_USER_URL:https://api.github.com/user}
    installations-url: ${GITHUB_INSTALLATIONS_URL:https://api.github.com/user/installations}
    installation-access-token-url: ${GITHUB_INSTALLATION_ACCESS_TOKEN_URL:https://api.github.com/app/installations/{installation_id}/access_tokens}
    installation-repositories-url: ${GITHUB_INSTALLATION_REPOSITORIES_URL:https://api.github.com/installation/repositories}

slack:
  auth-test-url: ${SLACK_AUTH_TEST_URL:https://slack.com/api/auth.test}
