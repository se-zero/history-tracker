spring:
  datasource:
    url: jdbc:h2:mem:backend_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ai:
  engine:
    url: http://localhost:8000

security:
  jwt:
    secret: test-jwt-secret-for-backend-security-tests
    access-token-ttl: PT15M
    refresh-token-ttl: P14D

github:
  app:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost/api/v1/auth/github/callback
    authorize-url: https://github.com/login/oauth/authorize
    access-token-url: https://github.com/login/oauth/access_token
    user-url: https://api.github.com/user
    installations-url: https://api.github.com/user/installations
