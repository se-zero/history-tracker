plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.history'
version = '0.0.1-SNAPSHOT'

ext {
	testcontainersVersion = '1.20.4'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// MCP 클라이언트용 OAuth 2.1 인가 서버(/oauth2/*)와 /mcp 리소스 서버 — Boot 4의 새 스타터 이름(옛 spring-boot-starter-oauth2-*는 deprecated)
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
	implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.0.1'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.13'
}

// --tests로 일부만 돌린 실행(편집 훅·TDD 확인)은 측정도 리포트도 하지 않는다 — 일부만 반영된 숫자라
// 의미가 없고, 마지막 전체 실행의 리포트를 덮어쓴다. 시간은 리포트보다 측정기(에이전트)가 더 쓴다.
def partialTestRun = gradle.startParameter.taskRequests.any { request ->
	request.args.any { it == '--tests' || it.startsWith('--tests=') }
}

tasks.named('test') {
	useJUnitPlatform()
	jacoco.enabled = !partialTestRun
	if (!partialTestRun) {
		finalizedBy tasks.named('jacocoTestReport')
	}
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
