[pytest]
# Service root on sys.path so tests can `from graph... / tools... / agent...`.
pythonpath = .
# Default run = offline unit suite only. Integration tests need live
# Neo4j/OpenAI and are run explicitly: `pytest tests/integration`.
testpaths = tests/unit
# Coverage is opt-in: `pytest --cov` (CI does this). A partial run (one file, -k, --lf)
# only measures what it ran, so the report formats below apply only when --cov is given.
addopts = --cov-report=term-missing --cov-report=html --cov-report=xml
markers =
    integration: requires a live Neo4j and/or OpenAI; not collected by default
