spring:
  application:
    name: pipeline-worker
  rabbitmq:
    host: localhost  # Docker 환경에서는 'rabbitmq'
    port: 5672
    username: guest
    password: guest
  datasource:
    url: ${PIPELINE_WORKER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/history_tracker}
    username: ${PIPELINE_WORKER_DATASOURCE_USERNAME:history}
    password: ${PIPELINE_WORKER_DATASOURCE_PASSWORD:history}
    driver-class-name: org.postgresql.Driver

security:
  credentials:
    key: ${BACKEND_CREDENTIAL_KEY:bG9jYWwtY3JlZGVudGlhbC1rZXktMzItYnl0ZXMhISE=}

server:
  port: 8081  # backend(8080)와 포트 충돌 방지

# 각 외부 API의 base URL 설정
# Jira는 테넌트마다 URL이 다르므로 요청 시 options.baseUrl로 덮어씀
app:
  github:
    base-url: https://api.github.com
  jira:
    base-url: ""  # 요청의 options.baseUrl로 전달
    max-pages-per-run: 50
  slack:
    base-url: https://slack.com/api

  rabbitmq:
    exchange: history.exchange
    queue: history.events
    routing-key-github: event.github
    routing-key-jira: event.jira
    routing-key-slack: event.slack

  checkpoint:
    path: ./checkpoint.json  # Docker 환경에서는 volume mount로 /data/checkpoint.json

  webhook:
    github:
      secret: ""  # GitHub webhook secret. X-Hub-Signature-256 검증에 사용.
    executor:
      await-termination-seconds: 300
    delivery-store:
      type: file
      path: ./webhook-deliveries.json
      
  integration:
    resolver:
      type: noop

  rate-limit:
    github:
      default-delay-ms: 300
      low-remaining-threshold: 10
    slack:
      conversations-list-delay-ms: 3000    # Tier 2: 20/min
      conversations-history-delay-ms: 1200  # Tier 3: 50/min
      conversations-replies-delay-ms: 1200  # Tier 3: 50/min
    jira:
      delay-ms: 200
