plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.history'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.13'
}

// --tests로 일부만 돌린 실행(편집 훅·TDD 확인)은 측정도 리포트도 하지 않는다 — 일부만 반영된 숫자라
// 의미가 없고, 마지막 전체 실행의 리포트를 덮어쓴다. 시간은 리포트보다 측정기(에이전트)가 더 쓴다.
def partialTestRun = gradle.startParameter.taskRequests.any { request ->
	request.args.any { it == '--tests' || it.startsWith('--tests=') }
}

tasks.named('test') {
	useJUnitPlatform()
	jacoco.enabled = !partialTestRun
	if (!partialTestRun) {
		finalizedBy tasks.named('jacocoTestReport')
	}
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}
