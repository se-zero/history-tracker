services:
  postgres:
    image: postgres:16
    container_name: history-tracker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: history_tracker
      POSTGRES_USER: history_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-history_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history_tracker -d history_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 인프라 (기본 실행) ─────────────────────────────────────────

  neo4j:
    image: neo4j:5.26-community
    container_name: history-graph-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt (드라이버 연결)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password1234}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: history-graph-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 애플리케이션 (--profile app) ──────────────────────────────

  ai-engine:
    build:
      context: ../../services/ai-engine
    container_name: history-graph-ai-engine
    ports:
      - "8000:8000"
    environment:
      # 인프라 hostname (컨테이너 네트워크에서 고정)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password1234}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # .env 에서 forward (필수: OPENAI_API_KEY)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QUERY_MODEL: ${QUERY_MODEL:-gpt-4o-mini}
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: [app]

  backend:
    build:
      context: ../../services/backend
    container_name: history-tracker-backend
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 네트워크 hostname으로 override
      DB_URL: jdbc:postgresql://postgres:5432/history_tracker?stringtype=unspecified
      DB_USERNAME: history_tracker
      DB_PASSWORD: ${POSTGRES_PASSWORD:-history_tracker}
      AI_ENGINE_URL: http://ai-engine:8000

      # 보안 키
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-must-be-changed}
      BACKEND_CREDENTIAL_KEY: ${BACKEND_CREDENTIAL_KEY:?BACKEND_CREDENTIAL_KEY must be configured}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}

      # GitHub App — infra/docker/.env 에서 forward (필수: APP_ID, SLUG, CLIENT_ID/SECRET, PRIVATE_KEY)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/auth/github/callback}
      GITHUB_INSTALLATION_URL: ${GITHUB_INSTALLATION_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]

  web-dashboard:
    build:
      context: ../../clients/web-dashboard
    container_name: history-tracker-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    profiles: [app]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
