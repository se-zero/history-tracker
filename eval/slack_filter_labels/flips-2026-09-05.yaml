# Slack LLM 필터 비교 라벨셋 — 판정이 갈린(flip) 메시지 검수용. label 칸만 채운다: keep | remove | unsure
#   - keep  : 그래프에 남길 가치가 있음 (보존이 맞음)
#   - remove: 노이즈라 제거가 맞음
#   - unsure: 원문만으로 판단 불가
# unstable: true인 항목은 런 간 판정이 갈린 노이즈이므로 score 채점에서 제외된다.
# verdicts 열: hardcoded(캡스톤 문장 하드코딩 기준선) / neutral(하드코딩 제거, 프로필 없음) /
#   profile_experiment(프로필 주입, 코드 반영 전 실험) / profile_adopted(프로필 주입, 코드 반영 후 최종·채택)
# flipped: 어느 비교에서 판정이 뒤집혔는지. 기각한 변형(최신 재료 프로필, 약한 기준)의 뒤집힘으로 추가됐던
#   항목은 라벨을 살리기 위해 그대로 두었고 flipped가 비어 있을 수 있다.
# 판단 기준은 필터 프롬프트의 보존/제거 기준과 같다 — 기술적 결정·버그 원인·작업 분담·구체적 요구사항은 keep,
# 단순 확인·내용 없는 요청·사적 대화·잡담은 remove. "이 메시지가 그래프에 남아 나중에 근거로 쓰일 가치가 있나"로 물으면 된다.
