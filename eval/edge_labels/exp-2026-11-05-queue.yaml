      message: |-
        feat: 이슈-커밋 연결(TRIGGERED_BY) 정확도 개선

        - 자연어 질문 응답에서 무관 커밋·PR이 이슈에 잘못 매칭되는 문제 해결.

        주요 변경:
        - TRIGGERED_BY 엣지에 source(text|semantic)/confidence 명시 + 기존 그래프 백필
        - 시맨틱 매칭 threshold 0.40 → 0.55, 비대칭 시간 윈도우(이슈 종료 후 +3일), ChangeSet당 top-1만 유지, 텍스트 매칭된 커밋은 시맨틱 후보에서 제외
        - get_issue_context에 CHILD_OF 재귀 순회 추가 — 부모 이슈에서 자식 작업 집계
        - TRIGGERED_BY 사용 8개 쿼리에 confidence ≥ 0.5 필터 + link_source 노출
        - pipeline-worker: PR 제목/본문에서 다중 jira_keys 추출, ai-engine: PR.CONTAINS 모든 커밋에 text TRIGGERED_BY 자동 전파
        - Issue.closedAt 스키마 + status-aware 클리어 (재오픈 시 잔존 시각 제거)
        - 마이그레이션 endpoint 3종: /migrations/triggered-by-source, /clear-semantic-triggered-by, /pr-jira-keys
        - 결정적 회귀 테스트 6케이스 추가 (test_phase1_regression.py)

        회귀 테스트 결과: HT-5/HT-3/HT-34/PR#18/HT-99/필터 6/6 PASS
