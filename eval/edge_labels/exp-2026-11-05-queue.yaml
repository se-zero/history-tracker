    id: 47ff488
    body:
      hash: 47ff488e1cc4ae540fef99ef78f8ed210733dd2f
      message: |-
        feat: 그래프 노드에 focus 질의용 도메인 키(ref) 부여

          채팅 답변의 관련 그래프에서 노드를 지정해 후속 질문할 때 에이전트가 그 노드를
          근거로 삼으려면, 사람이 읽는 title이 아니라 질의 도구가 요구하는 정확한 도메인
          키가 필요하다. 노드 투영 단일 지점(_to_graph_node)에서 ref: {type, id}
          (commit|pull_request|issue|message 어휘)를 방출한다.

          - commit은 meta의 [:7] 프리픽스가 아닌 전체 해시를 실어 get_changeset_context
            정확 매칭을 보장한다.
          - slack·github issue는 meta에 없던 conversation_id를 ref로 표면화한다.
          - actor/file 등 질의 도구 대상이 아닌 노드는 ref=null(텍스트 폴백).

          overview·subgraph·search가 공유하는 seam이라 세 경로에 자동 전파되고,
          backend GraphNodeResponse는 신규 타입 없이 EvidenceRef를 재사용해 왕복한다.
      files:
      - services/backend/src/test/java/com/history/backend/graph/controller/GraphControllerTest.java
      - services/ai-engine/tests/unit/test_overview_subgraph.py
      - clients/web-dashboard/src/types/graph.ts
      - services/ai-engine/graph/overview.py
      - services/backend/src/main/java/com/history/backend/graph/dto/GraphNodeResponse.java
