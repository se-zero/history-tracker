# 엣지 레벨 eval — recall 골든 쌍 (docs/measurement-plan.md B)
# "연결됐어야 하는 쌍"의 정답 목록. edge_eval.py --recall 이 이 파일의 쌍이
# 현재 그래프에 실제 엣지로 존재하는 비율(recall)을 계산한다.
#
# 작성 규칙 (edge_eval.py의 edge_exists() 질의와 맞춰야 함):
# - REFERENCE   : src = 커밋 해시 앞 7자,  dst = 스레드 루트 conversation_id
# - DISCUSSED_IN: src = 이슈 jira_key,    dst = 스레드 루트 conversation_id
# - TRIGGERED_BY: src = 커밋 해시 앞 7자,  dst = 이슈 jira_key
#   ⚠ TRIGGERED_BY는 semantic 엣지만 인정된다 (r.source='semantic').
#     커밋 메시지에 HT-xx가 명시된 쌍은 키 매칭으로 연결되므로 넣지 말 것 — 영원한 miss가 된다.
# - id에 "commit:" 같은 접두사를 붙이지 않는다 (precision 라벨셋과 동일한 bare id).
# - conversation_id는 반드시 문자열로 quote ('1781600092.933319').
#   리플라이 ts는 적을 필요 없다 — 스레드 내 모든 메시지가 같은 conversation_id를 가져
#   루트 ts 하나로 스레드 전체가 매치된다.
# - note에 연결 근거(당시 정황)를 적는다 — 검수자가 그래프를 안 뒤져도 판단 가능한 수준으로.
# - 명백한 쌍만 넣는다. 애매하면 버린다. 이 판정은 그래프와 독립적인 정답지이므로
#   빌더가 바뀌어도 유지하고, 쌍은 추가만 한다 (precision 라벨셋과 같은 원칙).
