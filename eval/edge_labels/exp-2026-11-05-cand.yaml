    id: 0949dc6
    body:
      hash: 0949dc6f6876f444ddb3e2e40ba9e38c2fa1bb54
      message: |-
        fix: aiEngineRestClient에 connect/read timeout 설정 (hang 시 풀 소진 방지)

          ai-engine이 hang하면 timeout이 없어 Tomcat 스레드가 무한 점유되고, 예외가 안
          던져져 기존 fallback/502 경로가 작동하지 못했다(PipelineWorkerConfig는 이미 거는데
          이쪽만 누락). SimpleClientHttpRequestFactory에 connect 3s / read 60s를 건다.

          빌드(/graph/build)가 단계 2에서 비동기 202로 바뀌어 모든 동기 호출이 짧아졌으므로
          단일 짧은 timeout이 안전하다. read(60s)는 LLM tool-calling 질의(/query)를 위한 여유.
      files:
      - services/backend/src/main/java/com/history/backend/config/AiEngineConfig.java
      - services/backend/CLAUDE.md
