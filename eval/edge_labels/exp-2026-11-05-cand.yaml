            낭비성 질문 누수 방지). handleSend early-return·Composer 비활성
          - Composer 중립 notice 배너(에러와 구분) + ChatEmpty 추천 카드 비활성.
            안내 배너는 입력창 위 한 곳(Composer)에만 표시
          - 타입/api/queryKey는 기존 build-status 패턴 미러링
