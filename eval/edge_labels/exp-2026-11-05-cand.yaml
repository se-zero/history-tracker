          - evidence 도메인 키(commit hash·#PR·jira_key·conversation_id)를 노드로 resolve해
            시드 + 1홉 이웃을 {nodes, edges, seeds}로 반환 (seeds는 인용 카드↔노드 매핑용)
          - 기존 _to_graph_node·_EDGE_QUERY 재사용, RETURN 필드는 _NODE_RETURN_FIELDS로 공유
          - evidence 정규화는 _normalize_evidence 단일 헬퍼로 group/resolve가 공유(파싱 drift 방지)
      files:
