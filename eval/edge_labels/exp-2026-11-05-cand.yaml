      hash: 9f307d794a9351e1413fbbb3cf86fe7aaddae3cd
      message: |-
        feat: 채팅 게이팅용 그래프 활동 상태 API 추가 (ai-engine)

          최초 수집중·수동 재구축중인 프로젝트의 채팅을 프론트에서 막기 위한
          읽기 전용 신호를 노출한다. 웹훅 증분과 그로 인한 자동 유지보수 빌드는
          차단 대상에서 제외한다 — 이미 한 번 구축된 프로젝트는 커밋 하나하나가
          다음 빌드를 기다리게 만들 필요가 없다.

          - postprocess: _ever_built(빌드 1회 성공=최초 수집 종료, 단조 플래그)와
            _manual_build_running(재구축 버튼 트리거만 표시) 상태 추가
          - get_graph_activity(project_id) → idle|collecting|building 판정
            (다중 인스턴스 전환 시 내부 소스만 교체하는 이음새)
          - GET /graph/activity 라우트 추가, /graph/build/status 스키마는 불변
          - GRAPH_ACTIVITY_WINDOW_SECONDS(기본 45) 설정 추가
      files:
      - services/ai-engine/tests/unit/test_postprocess_status.py
      - services/ai-engine/routers/graph.py
      - services/ai-engine/tests/unit/test_api_routes.py
      - services/ai-engine/graph/postprocess.py
