          - useGraphActivity 훅 — /graph/activity 폴링(활동중 5s/idle 15s),
            활동중→idle 전이 시 graph 쿼리 무효화로 게이트 자동 해제
          - ChatPage chatBlock — 연동 없음 > 노드 없음/활동중 우선순위로 파생.
