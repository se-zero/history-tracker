        한도를 공유해 429 위험  → 그래프 구축을 멀티 프로젝트에서 per-project로 변경,  OpenAI rate limiter 도입, ai-engine 호출 timeout
        설정
      status: 완료
  dst:
    type: message
    id: '1782286987.165039'
    body:
      conversation_id: '1782286987.165039'
      messages:
      - body: |-
          backend에서 ai-engine 호출 타임아웃 설정 작업하고있는데, 스레드 풀 관리때문에 그래프 구축하는 것을 비동기로 전환이 필요해서 알아보다가 현재 그래프 구축, 재구축이 전역으로 관리되고 있어서 한사람이 재구축 함수를 호출하면 그사람의 모든 프로젝트 그리고 다른사람의 모든 프로젝트까지 그래프를 재구축 하고 있더라고
