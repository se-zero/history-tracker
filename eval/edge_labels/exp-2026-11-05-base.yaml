        perf: PR 이슈 전파를 커밋 단건 연결로 (O(N²)→O(N)) + 통합 검증

        커밋마다 PR 전체 커밋에 TRIGGERED_BY를 재전파(1+2+…+N=O(N²))하던 것을,
        커밋 경로는 link_changeset_to_pr_issues로 '그 커밋 하나만' 연결한다. 전체
        전파는 PR 도착 시(_handle_pull_request)에만 1회. 결과 동일(멱등), 커밋 많은
        PR의 중복 쓰기·락 경합 제거(#1 동시성에서 특히).
        test_pr_issue_links.py: live Neo4j 4케이스(대상 커밋만 연결, 커밋별 호출로
        전체 완전 연결, CONTAINS·jira_keys 없으면 noop).
      files:
