      hash: 0a41adadef40543aac382fcd1f5dad2ebb5ca533
      message: |-
        feat: 채팅 질의 경로를 프로젝트 단위로 스코프 (HT-68)

        GraphRAG 도구 쿼리(tools/queries.py)의 모든 진입 Cypher에 project_id
        필터를 추가하고, backend MessageService → AiEngineQueryClient → /query →
        orchestrator → executor → queries로 project_id를 관통시킨다. 이로써 한
        사용자의 채팅 답변에 다른 프로젝트의 커밋·이슈·메시지가 인용되던 누출
        경로를 차단한다.

        - 진입 노드(자연키/이름/경로 매칭)만 스코프 — 도달 노드는 프로젝트 내부
          엣지로만 연결되므로(Phase A 보장) 추가 스코프 불필요
        - search_by_keyword: 벡터 인덱스 over-fetch 후 project_id 필터 + top_k
        - LLM은 project_id에 접근/변경 불가 (도구 인자 스키마에 없음)
        - ai-engine /query와 backend 요청에 project_id(snake_case) 추가
