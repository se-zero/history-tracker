  src:
    type: commit
    id: f570da7
    body:
      hash: f570da77073c51c72b6b6a9d8b359b27699ca22d
      message: |-
        feat: 그래프 빌드를 per-project 비동기로 전환 (202 + 상태 폴링)

          POST /graph/build를 동기 블로킹(최대 수 분)에서 백그라운드 태스크로 바꾸고
          202와 함께 현재 빌드 상태를 반환한다. 진행 상황은 GET /graph/build/status로 폴링한다.

          - 빌드를 프로젝트 단위로 스코프: run_postprocess_sequence(project_id, verify).
            store fetch(reference/issue_link/communication)와 clear_semantic_*·스레드 전파
            쿼리에 project_id 필터를 추가. 빌더는 이미 _group_by_project라 시그니처는 그대로 둔다
            (단일 프로젝트 데이터 → 단일 그룹). 필터를 안 주면(None) 전체 조회 — 운영 트리거 호환.
          - per-project 빌드 상태(idle/running/succeeded/failed)와 동시성:
            같은 프로젝트는 coalesce, 다른 프로젝트는 동시 허용하되 세마포어(MAX_CONCURRENCY,
            기본 2)로 전체 동시 빌드 수를 제한. OpenAI 호출은 단계 1 limiter가 페이싱한다.
          - 디바운스를 per-project화: mark_dirty(project_id) + dirty set. 자동/수동 빌드가
            같은 상태 머신을 공유해 같은 프로젝트 중복 빌드를 막는다.
          - 상태/dirty/세마포어는 in-process — 수평 확장 시 공유 저장소+분산 락으로 교체 필요.
      files:
      - services/ai-engine/graph/slack_batch_filter.py
      - services/ai-engine/graph/communication_store.py
      - services/ai-engine/routers/graph.py
      - services/ai-engine/CLAUDE.md
