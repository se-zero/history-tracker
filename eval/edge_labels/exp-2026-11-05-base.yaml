    body:
      hash: b7c5c5e6bb4b929a03e455c5c432ef96740b2fcc
      message: |-
        feat: backend 그래프 빌드를 per-project 비동기 202 + 상태 폴링으로 전환

          ai-engine의 per-project 비동기 빌드 계약(202 + GET /graph/build/status)에 맞춰
          backend 프록시를 갱신한다.

          - triggerBuild(projectId, verify) → POST /graph/build?project_id=&verify= (202),
            GraphBuildStatusResponse 반환. 신규 fetchBuildStatus(projectId) → GET .../status.
            ai-engine 호출 실패는 기존대로 BadGatewayException(502).
          - GraphService.buildProjectGraph는 이제 projectId를 인가 게이트이자 실제 빌드 인자로
            넘긴다. 신규 getBuildStatus로 상태 조회. 둘 다 소유권 검증 후에만 ai-engine 호출.
          - POST /api/v1/projects/{id}/graph/build는 202를 반환하고, 신규
            GET .../graph/build/status로 완료를 폴링한다.
          - GraphBuildStatusResponse(state/verify/started_at/result/error) 추가.
            result는 succeeded일 때만 채워지는 기존 GraphBuildResponse 재사용.

          테스트: AiEngineGraphClient(트리거 202·상태·502), GraphService(소유권 InOrder·
          인가 실패 시 미호출), GraphController(202·200·403·401) 13개 추가. 전체 282 통과.
      files:
      - services/backend/CLAUDE.md
      - services/backend/src/main/java/com/history/backend/graph/service/AiEngineGraphClient.java
      - services/backend/src/main/java/com/history/backend/graph/dto/GraphBuildStatusResponse.java
      - services/backend/src/test/java/com/history/backend/graph/service/GraphServiceTest.java
      - services/backend/src/test/java/com/history/backend/graph/service/AiEngineGraphClientTest.java
      - services/backend/src/main/java/com/history/backend/graph/controller/GraphController.java
      - services/backend/src/test/java/com/history/backend/graph/controller/GraphControllerTest.java
      - services/backend/src/main/java/com/history/backend/graph/service/GraphService.java
