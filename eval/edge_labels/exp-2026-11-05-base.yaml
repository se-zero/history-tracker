  src:
    type: issue
    id: HT-29
    body:
      key: HT-29
      title: 슬랙 데이터로 생성
      body: slack 관련 pipeline-worker 수정 요청 슬랙 데이터로 그래프 생성 2026/05/08 완료
      status: 완료
  dst:
    type: message
    id: '1778129329.547519'
    body:
      conversation_id: '1778129329.547519'
      messages:
      - body: |-
          pipeline-worker 수정 요청

          1. Slack 메시지 URL 수정 — `SlackNormalizer.java`
          *문제*
          `normalizeMessage` 메서드에서 모든 메시지의 URL을 채널 URL로 설정하고 있음. 같은 채널의 메시지는 전부 동일한 URL을 가져서, ai-engine에서 MERGE 시 마지막 메시지 하나만 노드로 남고 나머지는 덮어씌워짐.
          *현재 코드* (82번 줄)

          ```properties.put("url", "<https://slack.com/archives/>" + channelId);```
          *수정 코드*

          ```String tsForUrl = ts != null ? ts.replace(".", "") : "";
          properties.put("url", "<https://slack.com/archives/>" + channelId + "/p" + tsForUrl);```
          *이유*
          Slack 메시지 고유 딥링크 형식은 `<https://slack.com/archives/{channelId}/p{ts의> 소수점 제거}` 이며, `ts`는 77번 줄에 이미 있음.

          2. Jira Issue 부모-자식 관계 추가 — `JiraNormalizer.java`
          *문제*
          Jira Subtask는 `fields.parent.key`에 상위 이슈 키가 있는데, 이를 `refs`에 넣는 코드가 없음. 결과적으로 ai-engine에서 `CHILD_OF` 엣지가 생성되지 않아 이슈 계층 구조가 그래프에 반영되지 않음.
          *수정 위치*
          `normalizeIssues` 메서드 내 `NormalizedEvent` 생성 직전, `refsExtractor.extract(...)` 결과에 parent key를 추가.
          *수정 코드*

          ```Map&lt;String, String&gt; refs = refsExtractor.extract(summary + " " + descriptionText);

          // parent 필드에서 상위 이슈 key 추출
          Map&lt;String, Object&gt; parent = (Map&lt;String, Object&gt;) fields.get("parent");
          if (parent != null) {
              String parentKey = (String) parent.get("key");
              if (parentKey != null) {
                  refs.put("parentKey", parentKey);
              }
          }```
          *이유*
          raw API 응답에는 이미 `fields.parent.key`가 포함되어 있으며 (HT-5, HT-7 등 Subtask에서 확인됨), ai-engine의 `_handle_issue`는 `refs.parentKey`가 있을 때 `CHILD_OF` 엣지를 생성하는 로직이 이미 구현되어 있음. pipeline-worker에서 값만 전달하면 됨.
        occurred_at: '2026-05-07T04:48:49.547519Z'
        channel: 프로젝트
        author: 서준수
      - body: |-
          pipeline-worker 수정 요청 (re)

          1. Slack 메시지 URL 수정 — `SlackNormalizer.java`
          *문제*: 모든 메시지의 URL이 채널 URL로 동일해서 같은 채널 메시지들이 Neo4j에서 하나의 노드로 덮어씌워짐
          *수정* (82번 줄)

          ```// 현재
          properties.put("url", "<https://slack.com/archives/>" + channelId);

          // 수정
          String tsForUrl = ts != null ? ts.replace(".", "") : "";
          properties.put("url", "<https://slack.com/archives/>" + channelId + "/p" + tsForUrl);```
          2. Jira Issue CHILD_OF 엣지 추가 — `JiraNormalizer.java`
          *문제*: Subtask의 `fields.parent.key`를 `refs`에 넣지 않아서 이슈 계층 구조(CHILD_OF 엣지)가 그래프에 반영 안 됨
          *수정* (`refsExtractor.extract(...)` 직후에 추가)

          ```Map&lt;String, String&gt; refs = refsExtractor.extract(summary + " " + descriptionText);

          Map&lt;String, Object&gt; parent = (Map&lt;String, Object&gt;) fields.get("parent");
          if (parent != null) {
              String parentKey = (String) parent.get("key");
              if (parentKey != null) {
                  refs.put("parentKey", parentKey);
              }
          }```
          3. Jira Issue Actor 연결 방식 변경 — `JiraNormalizer.java` + ai-engine
          *문제*: 현재 reporter만 CREATED 엣지로 연결. assignee(실제 작업자)도 연결 필요
          *수정 방향*
          • `(Actor)-[:CREATED]-&gt;(Issue)`— reporter (현행 유지)
          • `(Actor)-[:ASSIGNED_TO]-&gt;(Issue)`— assignee (있을 때만)
          *pipeline-worker*: `NormalizedEvent`의 `refs`에 assignee accountId 추가

          ```Map&lt;String, Object&gt; assigneeField = (Map&lt;String, Object&gt;) fields.get("assignee");
          if (assigneeField != null) {
              refs.put("assigneeId", (String) assigneeField.get("accountId"));
          }```
          *ai-engine (`event_handler.py`, `builder.py`)*: `refs.assigneeId` 존재 시 ASSIGNED_TO 엣지 생성 로직 추가 (ai-engine 쪽은 추후 별도 구현)
        occurred_at: '2026-05-07T04:59:17.519949Z'
        channel: 프로젝트
        author: 서준수
      - body: 1번2번은 작업해서 pr날렸어
        occurred_at: '2026-05-07T10:40:35.611239Z'
        channel: 프로젝트
        author: 정세영
      - body: assignee accountId를 refs에 추가해야 동명이인을 구분할 수 있다고 하는데 assignee는 이름만 들어오는거 맞아?
        occurred_at: '2026-05-07T10:43:40.945749Z'
        channel: 프로젝트
        author: 서준수
      - body: assignee properties에 말고 refs에 넣는게 그래프 만들때 편하지?
        occurred_at: '2026-05-07T11:48:57.204939Z'
        channel: 프로젝트
        author: 정세영
      - body: 응 refs에 넣는게 좋지
        occurred_at: '2026-05-07T11:49:54.148819Z'
        channel: 프로젝트
        author: 서준수
      - body: 오케이 커밋했어
        occurred_at: '2026-05-07T11:54:34.303919Z'
        channel: 프로젝트
        author: 정세영
