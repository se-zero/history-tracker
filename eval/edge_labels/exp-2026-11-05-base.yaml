        perf: 대화·메시지 목록 커서 기반 페이지네이션 (backend)

          표시용 무제한 조회를 (timestamp, id) 키셋 커서 페이지네이션으로 전환해
          데이터 누적에 따른 O(n) 메모리·쿼리 악화를 방지 (B-4, docs/b4-conversation-pagination.md).

          - Cursor: (timestamp, id) opaque Base64 인코딩/디코딩 유틸 + 단위 테스트
          - MessageRepository.findLatest/findOlderBefore,
            ConversationRepository.findFirstPageByProject/findPageByProjectBefore
            (createdAt·updatedAt + id 복합 키셋, 기존 인덱스로 range scan 커버 → 마이그레이션 없음)
          - MessageService.findMessagesPage / ConversationService.findConversationsPage
            (limit+1로 hasMore 판정, 최신순 조회→오름차순 변환)
          - getConversationDetail: 전체→최신 N개(메시지 30) + hasMoreMessages·oldestCursor,
            대화 목록 페이지 20개
          - GET .../conversations?cursor=, GET .../messages?before= 페이지 envelope 응답
            (ConversationPageResponse / MessagePageResponse)
          - 내부 carrier record(ConversationPage·MessagePage·ConversationDetail)는 service 패키지,
            외부 응답 DTO는 dto 패키지로 정리
          - AI 문맥(요약 커서) 경로는 불변
