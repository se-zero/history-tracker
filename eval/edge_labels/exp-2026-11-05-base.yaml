         perf: 대화·메시지 목록 무한 스크롤 (web-dashboard)

          backend 커서 페이지네이션에 맞춰 표시 경로를 무한 스크롤로 전환 (B-4).

          - 대화 목록: useInfiniteQuery + 하단 sentinel(IntersectionObserver)로 아래로
            무한 스크롤 (select로 평면 Conversation[] 유지 → 기존 소비처 무변경)
          - 메시지: 상세는 최신 N개 로드, 위로 스크롤 시 listOlderMessages로 older
            한 페이지를 상세 캐시 앞에 prepend(useLoadOlderMessages)
          - ChatStream: 진입·전송·응답은 하단 고정, older prepend는 scrollHeight 증분만큼
            scrollTop 보정해 보던 위치 유지 (overflow-anchor:none으로 브라우저 자동
            보정과 이중 적용 방지)
          - older 로드 안정화: 동기 ref 가드로 중복 prepend 방지, 실패 시 인라인 안내 표시
          - types/api: ConversationDetail += hasMoreMessages·oldestCursor,
            ConversationPage·MessagePage 추가
      files:
