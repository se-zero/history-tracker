      title: GraphRAG 답변 품질 개선
      body: '배경 자연어 질문 10건 테스트 결과, 응답 정확도에 다음과 같은 패턴의 문제가 반복됨: 이슈와 관련 없는 커밋/PR/메시지가 답변에 포함됨 (HT-5, HT-34,
        PR #18 케이스) 부모 이슈(HT-3)처럼 자식 작업이 많은 경우 일부만 답변 여러 Slack 스레드를 한 대화로 합치고 화자가 뒤바뀜 (HT-36 케이스) 근거가
        없을 때 LLM이 일반론으로 답을 채워 환각 발생 (HT-35 "왜 필요했나?" 케이스) 파일 이름의 확장자가 다르면 검색 실패 (GitHubNormalizer 케이스)
        구체적 entity가 없는 질문에서 즉시 포기 목표 도구 호출/그래프 빌드/응답 생성 전 단계에서 정확도와 출처 신뢰도를 끌어올려, 동일 테스트 10건의 적절성을 측정
        가능한 수준으로 개선. 완료 조건 동일 테스트 케이스 10건 재실행 시 "관련 없는 항목 포함" 카운트 감소 환각(데이터에 없는 추측) 발생률 측정 가능 하위 4개 task
        모두 머지'
      status: 완료
