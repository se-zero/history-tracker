    id: caa50b3
    body:
      hash: caa50b3458c7474c5756a31cf0d1110d3ede957e
      message: |-
        feat: 수집 실패 재시도·DLQ 안전망 추가 (ai-engine)

          consumer의 handle() 실패 메시지를 requeue=False로 조용히 버리던 것을,
          지연 재시도 후 DLQ 파킹으로 보존하도록 변경한다. 발행 측(pipeline-worker)은
          이미 checkpoint를 넘긴 상태라 소비 실패는 재수집으로 복구되지 않기 때문이다.

          - handle() 실패 → history.events.retry(TTL, 기본 30s)로 재발행해 최대
            INGEST_RETRY_MAX(기본 3)회 재시도, 소진 시 history.events.dlq에 파킹
          - JSON 파싱 실패(malformed)는 재시도 무의미 → 별도 inspect 큐
            history.events.parking으로 분리(replay 미대상)
          - 재발행은 소비 채널과 분리된 별도 채널에서 수행(채널 오류 격리)
          - 재발행 실패 시 원본 미ack → 브로커 재배달로 유실 방지
          - admin: GET /dlq/stats(dlq·parking 개수), POST /dlq/replay(DLQ만 재투입)
          - env: INGEST_RETRY_MAX, INGEST_RETRY_DELAY_MS
          - 기존 history.events 메인 큐·pipeline-worker는 변경 없음
      files:
      - services/ai-engine/tests/unit/test_consumer_retry.py
      - services/ai-engine/CLAUDE.md
      - services/ai-engine/graph/consumer.py
      - services/ai-engine/routers/admin.py
      - services/ai-engine/tests/unit/test_api_routes.py
