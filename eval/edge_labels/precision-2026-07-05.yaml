        feat: 관련 그래프 패널 hover 연동·마지막 답변 추적 (web-dashboard)

          인용 카드 hover로 그래프를 그 답변으로 전환하고 노드를 강조한다.
          - 활성 답변 카드 hover: 해당 시드 노드를 강조(치우면 강조만 해제)
          - 비활성 답변 카드 hover(200ms 인텐트 딜레이): 그 답변 서브그래프로
            전환 후 강조, 치워도 그래프는 유지 — 스크롤로 닿지 않는 중간
            질의응답의 그래프도 hover로 접근 가능
