    id: '1783143134.172379'
    body:
      conversation_id: '1783143134.172379'
      messages:
      - body: |-
          회의 때 노션에 정한 작업은 다 한거 같은데, 이제 남은게 내 생각엔 성능 향상이랑 배포 준비인거 같아
          그래서 배포준비(redis 포함)전에 성능을 올릴 차례인거 같은데
          그래프 구축, 응답 퀄리티 개선 작업 전에 지금 상태에서 테스트 케이스를 만들어 측정한 다음 개선작업이 진행될때마다 얼마나 향상되었는지 기록하는게 좋을거 같아
        occurred_at: '2026-07-04T05:32:14.172379Z'
        channel: 프로젝트
        author: 정세영
      - body: 관련해서 작성해놓은 md 파일이 있는데 노션에 올려둘테니까 한번 읽어보고 의견 부탁할게
        occurred_at: '2026-07-04T05:32:47.449469Z'
        channel: 프로젝트
        author: 정세영
      - body: |-
          그래프만 같으면 서로 테스트 가능하니깐 이렇게 하는게 나을거 같아
          1. A가 그래프를 구축하고 덤프파일로 B에게 공유
          2. B는 공유받은 덤프파일을 로드 (빌드X)
          3. 각자 테스트 가능
          4. 그래프 연결 로직을 바꿔서 그 그래프를 채택하기로 확정을 하게되면 A가 다시 덤프파일로 공유
          5. B는 새로받은 덤프파일을 로드해서 이어서 테스트
        occurred_at: '2026-07-05T02:17:41.049589Z'
        channel: 프로젝트
        author: 정세영
      - body: |-
          그리고 테스트 셋은 둘이 같이 만들면 될거같아
          • e2e 골든셋(질의 품질용) 40개
          • 엣지 라벨셋 (그래프 개선용)
              ◦ precision 라벨(그린 엣지가 맞나) 50~100개
                  ▪︎ B-1 precision: 그래프에 실제로 있는 엣지를 놓고 "이거 맞아?"를 잰다 → 항목은 현재 그래프에 존재하는 엣지
              ◦ recall 골든 쌍(연결됐어야 할 걸 놓쳤나) 10~20쌍
                  ▪︎ B-2 recall: 사람이 아는 "연결됐어야 할 쌍"을 놓고 "그래프가 이걸 만들었나?"를 잰다 → 항목은 그래프에 없을 수도 있는 기대값
        occurred_at: '2026-07-05T02:20:22.459299Z'
        channel: 프로젝트
        author: 정세영
      - body: 그래프 새로 만들어야 되나
        occurred_at: '2026-07-05T04:52:34.810519Z'
        channel: 프로젝트
        author: 서준수
      - body: 그래프 연결 개선을 위한 원천 데이터 스냅샷"(NormalizedEvent 셋)도 같이 준비해놔야 할거같아.
        occurred_at: '2026-07-05T07:28:54.894949Z'
        channel: 프로젝트
        author: 정세영
