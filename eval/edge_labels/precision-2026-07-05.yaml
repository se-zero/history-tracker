      title: backend에 graph API (인가 게이트)
      body: 'GET /api/v1/projects/{projectId}/graph  →  GraphController  →  GraphService 인가는 기존 패턴 재사용
        :  projectService.getProject(userId, projectId) 가 소유자가 아니면  ForbiddenException  (403)을 던지고 프로젝트가
        존재하지 않으면  NotFoundException  (404)을 던지는 구조라(IntegrationService.java:49와 동일), 이 호출을 통과한 뒤에만 ai-engine에
        요청 AiEngineQueryClient 와 같은 패턴으로  AiEngineGraphClient  추가 (기존  aiEngineRestClient  재사용) 신뢰 경계:
        ai-engine은 backend가 넘긴 project_id를 신뢰하는 내부 서비스. 단, 현재 docker-compose에서 ai-engine  :8000 이 호스트에
        노출되어 있다면 운영 환경에서는 내부 네트워크로 제한 필요'
      status: 완료
