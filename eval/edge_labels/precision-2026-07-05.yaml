      - services/pipeline-worker/src/main/resources/application.yaml
      - services/pipeline-worker/src/main/java/com/history/pipeline_worker/config/RabbitMqConfig.java
      - services/pipeline-worker/src/main/java/com/history/pipeline_worker/trigger/CollectionTriggerService.java
