    id: 022907a
    body:
      hash: 022907a80431d0c99346b458acd972ca245de3b9
      message: |-
        feat: 그래프 노드 focus 질의 — 입력창 칩 + 근거 고정 (Stage 1)

          관련 그래프에서 지정한 노드를 focus_evidence로 프론트→backend→ai-engine
          orchestrator까지 실어, 에이전트가 그 노드를 답변 근거로 고정하게 한다.
          사용자는 노드를 칩으로 첨부해 그에 대한 후속 질문을 이어갈 수 있다.

          frontend:
          - 채팅에 추가 시 ref 있는 노드는 입력창 안 칩으로 첨부(ref로 dedupe),
            ref 없는 노드(actor/code)는 기존대로 제목 텍스트 폴백.
          - 칩은 X 버튼 또는 입력이 빈 상태의 Backspace로 제거. 노드만으로도 전송 가능
            (node-only는 백엔드 @NotBlank 때문에 기본 질문으로 채워 보낸다).
          - sendMessage가 focusEvidence를 함께 전송, 전송 실패 시 칩도 복구.

          backend:
          - CreateMessageRequest.focusEvidence(@Size(max=10), EvidenceRef 재사용)를
            addMessage→ask→AiEngineQueryRequest.focus_evidence로 전달. null→[] 정규화는
            ask() 한 곳. 신규 대화 첫 메시지 경로는 focus 없음([]).

          ai-engine:
          - QueryRequest.focus_evidence(관대한 FocusEvidence). orchestrator.run이 focus
            지시를 '현재 턴'에 배치해 최종 structured 근거까지 살린다(prior_evidence와
            반대). 유형별 도구(commit→get_changeset_context 등)를 명시해 먼저 조회하도록
            유도. commit ref는 전체 해시라 정확 매칭.
      files:
      - services/backend/src/main/java/com/history/backend/conversation/service/AiEngineQueryClient.java
      - services/backend/src/test/java/com/history/backend/conversation/service/ConversationServiceTest.java
      - services/ai-engine/query_models.py
