    id: '1778129329.547519'
    body:
      conversation_id: '1778129329.547519'
      messages:
      - body: |-
          pipeline-worker 수정 요청

          1. Slack 메시지 URL 수정 — `SlackNormalizer.java`
          *문제*
          `normalizeMessage` 메서드에서 모든 메시지의 URL을 채널 URL로 설정하고 있음. 같은 채널의 메시지는 전부 동일한 URL을 가져서, ai-engine에서 MERGE 시 마지막 메시지 하나만 노드로 남고 나머지는 덮어씌워짐.
          *현재 코드* (82번 줄)

          ```properties.put("url", "<https://slack.com/archives/>" + channelId);```
          *수정 코드*

          ```String tsForUrl = ts != null ? ts.replace(".", "") : "";
          properties.put("url", "<https://slack.com/archives/>" + channelId + "/p" + tsForUrl);```
          *이유*
          Slack 메시지 고유 딥링크 형식은 `<https://slack.com/archives/{channelId}/p{ts의> 소수점 제거}` 이며, `ts`는 77번 줄에 이미 있음.

          2. Jira Issue 부모-자식 관계 추가 — `JiraNormalizer.java`
          *문제*
          Jira Subtask는 `fields.parent.key`에 상위 이슈 키가 있는데, 이를 `refs`에 넣는 코드가 없음. 결과적으로 ai-engine에서 `CHILD_OF` 엣지가 생성되지 않아 이슈 계층 구조가 그래프에 반영되지 않음.
          *수정 위치*
          `normalizeIssues` 메서드 내 `NormalizedEvent` 생성 직전, `refsExtractor.extract(...)` 결과에 parent key를 추가.
          *수정 코드*

          ```Map&lt;String, String&gt; refs = refsExtractor.extract(summary + " " + descriptionText);

          // parent 필드에서 상위 이슈 key 추출
