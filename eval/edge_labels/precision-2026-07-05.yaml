      title: 프론트엔드 개선 작업
      body: 그래프 탐색 페이지에서 마우스 휠 확대/축소 할때 마우스 커서가 위치한 지점을 기준으로 확대 축소 그래프 탐색 탭 필터중 code는 명칭 변경 필요 (실제로 코드
        diff에 관한 내용은 노드가 아닌 MODIFIED 엣지에 들어가기 때문) (실제로 그래프에 뜨는 노드는 파일임) 데이터 소스 탭에서 연결된 integration(github,
        jira, slack)들은 연결 해제 기능을 제공하지 않음(api 없음) -> 프론트에서 연결 해제 제거, 깃허브 레포는 연결된 것만 뜨게 수정 설정 탭의 식별자는 삭재
        (필요없음) 프로필의 ... 버튼 누르면 현재 light모드와 로그아웃만 있는데 계정 설정탭을 만들어 회원 탈퇴 기능을 옮김 프로젝트를 누르면 '현재 프로젝트 설정 '이
        있는데 왼쪽 탭에 있는 설정과 같아 한쪽을 제거 대화 이름변경 버그 수정
      status: 완료
  dst:
    type: message
    id: '1782102320.056619'
    body:
      conversation_id: '1782102320.056619'
      messages:
      - body: |-
          1. 그래프 탐색 페이지에서 마우스 휠 확대/축소 할때 마우스 커서가 위치한 지점을 기준으로 확대 축소가 되면 좋을 것 같음
          2. 그래프 탐색 탭 필터중 code는 명칭이 애매한것 같음 (실제로 코드 diff에 관한 내용은 노드가 아닌 MODIFIED 엣지에 들어가기 때문) (실제로 그래프에 뜨는 노드는 파일임)
          3. 데이터 소스 탭에서 연결된 integration(github, jira, slack)들은 연결 해제 기능을 제공하지 않음(api 없음) -&gt; 프론트에서 연결 해제 제거, 깃허브 레포는 연결된 것만 뜨게 바꾸면 좋을 것 같음
          4. 설정 탭의 식별자는 필요 없어보임
          5. 프로필의 ... 버튼 누르면 현재 light모드와 로그아웃만 있는데 계정 설정탭을 만들어 회원 탈퇴 기능을 옮기는게 좋을 것 같음
          6. 프로젝트를 누르면 '현재 프로젝트 설정 '이 있는데 왼쪽 탭에 있는 설정과 같음. 한쪽을 제거하는게 좋아 보임
        occurred_at: '2026-06-22T06:45:54.688479Z'
        channel: 프로젝트
        author: 정세영
      - body: 내가 데이터 소스 연결 해제 기능을 백엔드에 만들어 놓았더라고
        occurred_at: '2026-06-23T05:08:12.922469Z'
        channel: 프로젝트
        author: 서준수
      - body: 우선 깃허브레포 연결 해제에 대해서는 프로젝트 하나당 레포 하나가 무조건 연결되어있는게 맞고, 깃허브 레포를 해제하고 다른걸 연결하는 비용보다 새로운 프로덱트를
