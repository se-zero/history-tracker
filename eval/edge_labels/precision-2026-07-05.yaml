      message: |-
        fix: Slack 재수집 시 llm_filtered 판정 보존 (ai-engine)

          Communication upsert가 MERGE 후 무조건 SET으로 llm_filtered를 덮어,
          전체 재수집으로 같은 메시지가 재-MERGE되면 노이즈 필터의 keep(true)
          판정이 false로 리셋돼 재필터·삭제될 수 있었다. llm_filtered를
          ON CREATE SET으로 옮겨 신규 노드만 초기화하고 기존 노드는 판정을
          보존한다. body·embedding 등 메타는 그대로 항상 갱신.
