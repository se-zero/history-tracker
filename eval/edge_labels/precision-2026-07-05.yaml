      body: 'GET /graph/overview?project_id=...  — 노드/엣지 목록 (모든 Cypher에  WHERE n.project_id = $project_id
        ) 응답은 프론트 types/graph.ts의  GraphData  형태에 맞춤:  ChangeSet→commit ,  PullRequest→pr ,  Communication→slack
        ,  Issue→jira/issue ,  Actor→actor ,  File→code 페이징 + 노드 타입 필터  (그래프가 커질 것 대비) limit  (기본 200,
        최대 500): content 노드( ChangeSet / PullRequest / Issue / Communication )를  occurredAt  최신순으로 자른다.  Actor
        / File 은 limit에 안 들어가는 이웃 확장. types  (쉼표 구분 프론트 type 화이트리스트, 생략 시 전체): content 타입( commit / pr
        / jira / issue / slack )은  노드 선택 단계에서  거른다 → "필터 후 최근순 top-N" Communication 은 source로 분기 →  issue
        =GitHub Communication,  slack =Slack Communication 확장 타입( actor / code )은 이웃 확장  포함 여부 를 토글 content
        타입을 하나도 안 고르면 앵커가 없으므로 빈 결과 (actor/code는 content에 매달려야만 등장) 엣지는 항상 최종 선택된 노드 집합 내부만 (dangling
        없음)'
