          엣지로만 연결되므로(Phase A 보장) 추가 스코프 불필요
        - search_by_keyword: 벡터 인덱스 over-fetch 후 project_id 필터 + top_k
        - LLM은 project_id에 접근/변경 불가 (도구 인자 스키마에 없음)
