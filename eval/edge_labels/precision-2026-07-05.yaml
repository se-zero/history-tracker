    body:
      hash: 460a3b261ff7d5a054d76aa192f3732da407bb78
      message: |-
        perf: webhook 수집 처리량·유실 방지 개선 (풀 분리·publisher confirm·Slack 캐시)

        webhook 증분 수집 경로의 처리량과 데이터 유실 위험을 함께 개선한다.

        - executor 풀 분리 + 동시성/직렬화: 초기 수집 전용 collectionTaskExecutor(pool=3)를 분리해
          장기 초기 수집이 webhook 풀을 굶기지 않게 하고, webhookTaskExecutor를 pool-size 1→4로 올려
          여러 프로젝트 webhook을 병렬 처리한다. 동일 프로젝트 동시 수집은 ProjectCollectionSerializer
          (project id striped lock)로 직렬화해 중복 풀스캔을 막는다. (P-2)
        - RabbitMQ publisher confirm: EventPublisher가 배치 발행 후 CorrelationData별 ack/return을 대기하고
          nack·unroutable·timeout 시 EventPublishException으로 checkpoint 전진을 막아 조용한 유실(영구 빈칸)을
          방지한다 (publisher-confirm-type=correlated, publisher-returns=true, template mandatory=true). (P-3)
        - Slack users.list TTL 캐시: fetchUserMap을 auth별로 app.slack.user-map-cache-ttl(기본 5m) 동안 캐시해
          webhook 수집마다 전체 멤버를 재조회하던 헛조회를 제거한다. (P-7)
      files:
      - services/pipeline-worker/src/main/java/com/history/pipeline_worker/webhook/ProjectCollectionSerializer.java
      - services/pipeline-worker/src/main/java/com/history/pipeline_worker/messaging/EventPublishException.java
      - services/pipeline-worker/src/main/java/com/history/pipeline_worker/config/WebhookTaskConfig.java
