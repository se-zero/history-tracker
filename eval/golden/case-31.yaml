# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement-plan.md 참고.
# [2소스(GitHub↔Slack) — PR의 슬랙 논의+수정사항] PR #46(HT-93).
#   Slack 1782102320: 프론트 UI/UX 개선 항목 논의 + '데이터 소스 연동 해제' 기능 제거 결정
#   → PR #46이 UI 개선·연동 해제 제거·대화 이름변경 버그 수정을 구현. (진짜 논의가 있는 스레드)
id: case-31
question: "PR #46은 어떤 슬랙 메세지에서 논의되어서 어떤 수정사항이 있었어?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# pull_request -> #번호, message -> conversation_id(루트 ts)
expected_evidence_ids:
- "pull_request:#46"               # web-dashboard UI 개선·연동 해제 제거·대화 이름변경 버그 수정
- "message:1782102320.056619"      # UI 개선 항목 논의 + 연동 해제 기능 제거 결정 스레드

# PR #46이 참조하는 이슈 (인용 무방 — 질문자도 "HT-93 나올 수도" 언급)
acceptable_evidence_ids:
- "issue:HT-93"

# summary에 담겨야 할 핵심 사실 (슬랙 논의 → PR 수정사항)
expected_facts:
- "슬랙에서 프론트 UI/UX 개선 항목을 논의하고, 데이터 소스 연동 해제 기능을 제거하기로 결정했다"
- "PR #46은 web-dashboard UI 개선, 연동 해제 기능 제거, 대화 이름변경 버그 수정을 포함한다"

# 오염 감지 — 등장하면 감점
expected_absent:
  evidence_ids: []
  facts:
    - "PR #46의 논의를 무관한 슬랙 스레드로 귀속하거나, 연동 해제 '추가'처럼 반대로 서술"

# 케이스별 기계 채점 (2소스 + 논의→수정 연결)
rule_checks:
- "evidence에 pull_request:#46 와 message:1782102320.056619 가 함께 존재 (2소스)"
- "summary가 슬랙 논의(연동 해제 제거·UI 개선 결정)와 PR 수정사항을 연결해 서술"
