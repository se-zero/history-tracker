# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement-plan.md 참고.
# [2소스(GitHub↔Slack) — 발견자+논의+수정] 그래프 구축/재구축이 '전역'으로 실행되던 문제.
#   Slack 1782286987.165039(작성자 정세영, name 필드)에서 발견·논의 → PR #47에서 per-project
#   비동기로 전환해 수정(b7c5c5e backend, f570da7 ai-engine). 3요소(누가/어디서/무엇으로) 모두 필요.
id: case-30
question: "그래프 구축, 재구축이 전역으로 발생하던 문제는 누가 발견했고 어떤 슬랙 메세지에서 논의되었으며 어떤 커밋 또는 PR에서 수정된거야?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# message -> conversation_id(루트 ts), pull_request -> #번호, commit -> hash 앞 7자
expected_evidence_ids:
- "message:1782286987.165039"      # 정세영이 전역 재구축 문제를 발견·논의한 스레드
- "pull_request:#47"               # per-project 그래프 빌드 전환 PR
- "commit:b7c5c5e"                 # backend 그래프 빌드를 per-project 비동기 202로 전환
- "commit:f570da7"                 # ai-engine 그래프 빌드를 per-project 비동기로 전환

# 같은 PR #47의 관련 커밋 (핵심 수정은 아니지만 인용 무방)
acceptable_evidence_ids:
- "commit:7c68b22"                 # web-dashboard 재구축 UX 전환
- "commit:0949dc6"                 # ai-engine 호출 타임아웃 설정 (스레드풀 관리 — 논의 발단)
- "issue:HT-95"                    # PR #47이 참조하는 이슈

# summary에 담겨야 할 핵심 사실 (누가 / 어디서 / 무엇으로)
expected_facts:
- "정세영이 그래프 구축·재구축이 프로젝트 무관하게 전역으로 실행되던 문제를 발견했다"
- "이 문제는 Slack 스레드(1782286987.165039)에서 논의됐다 (타임아웃/스레드풀 관리로 비동기 전환을 알아보다 발견)"
- "PR #47에서 그래프 빌드를 프로젝트 단위(per-project) 비동기로 전환해 수정했다"

# 오염 감지 — 등장하면 감점
expected_absent:
  evidence_ids: []
  facts:
    - "발견자를 정세영이 아닌 다른 사람으로 귀속"
    - "전역 재구축 문제를 무관한 슬랙 스레드나 다른 PR에서 수정됐다고 서술"

# 케이스별 기계 채점 (3요소 + 2소스)
rule_checks:
- "evidence에 message(슬랙)와 (pull_request 또는 commit)이 모두 존재 (2소스)"
- "evidence의 message에 1782286987.165039 이 포함"
- "summary가 발견자(정세영)·논의 슬랙·수정 PR(per-project 전환)을 모두 담음"
