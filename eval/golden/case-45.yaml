# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement.md 참고.
# [이슈 랭킹 — 전수 비교] rank_issues로만 답할 수 있는 질문. get_timeline으로 답하면 어쩌다 걸린
#   이슈를 1위로 오답낸다(docs/tools.md 4b).
# [내부 용어 노출] 원래 질문("가장 논의가 많이 된 주제가 뭐야?")이 실제로 "HT-129의
#   discussion_count가 12건입니다"라는 답을 만들었다 — 모델이 지표를 부를 이름이 필드명뿐이었기
#   때문. 용어집·서버 가드 도입 후의 회귀 감시용 케이스다.
#
# **질문을 지표에 맞춰 좁힌 이유**: "가장 많이 논의된"의 사람 기준 정답과 rank_issues의 출력이
#   어긋난다. 실측(project eb74cbd9, 2026-08-20) — 메시지 수 1위는 HT-102·HT-94(각 13)지만 실제로
#   그 이슈를 언급한 씨앗 메시지는 각 2건("pr 날렸어" 류 공지)뿐이고 나머지 11건은 같은 스레드가
#   전파된 것이다. 서로 다른 대화 4개에 걸쳐 설계 논의까지 있는 HT-38(12건/4스레드)이 사람 기준
#   1위에 가깝다. 이 케이스는 **도구 선택과 용어 표기**를 재는 것이 목적이므로 질문을 지표가
#   실제로 답할 수 있는 범위로 좁혔다. 지표 자체의 타당성은 별건 —
#   docs/query-followups.md 5번.
# 순위 실측(2026-08-20): HT-102 13(2스레드) · HT-94 13(2스레드) · HT-38 12(4스레드) · HT-97 12(1스레드).
#   상위권 전체에서 본문 명시 참조(text)는 0건 — 전부 유사도 추정 + 스레드 전파다.
#   **수치는 재수집·재구축으로 움직인다. 러너 실행 직전에 다시 세고 어긋나면 이 파일을 갱신한다.**
id: case-45
question: "관련 대화가 가장 많이 연결된 이슈가 뭐야?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# issue -> issue_key, message -> conversation_id(루트 ts), pull_request -> #번호, commit -> hash 앞 7자
# 동률이므로 **둘 다** 필수다 — 하나만 답하면 공동 1위를 놓친 것이니 recall 0.5가 맞는 채점이다.
expected_evidence_ids:
- "issue:HT-102"                 # '글로벌 검색 추가' — 관련 대화 13건 (공동 1위)
- "issue:HT-94"                  # 'ai-engine 최적화' — 관련 대화 13건 (공동 1위)

# 인용 무방 — 상위권 나머지와 1위 이슈들에 연결된 대화 스레드.
# 스레드를 필수로 올리지 않는 이유: 씨앗 메시지가 "pr 날렸어" 류 공지라, 필수로 두면 공지를
# '논의의 근거'로 인용하도록 강제하게 된다. 랭킹 질문의 인용 앵커는 이슈다.
acceptable_evidence_ids:
- "issue:HT-38"                  # '그래프 파이프라인 수정' — 12건
- "issue:HT-97"                  # 'conversation, message 페이지네이션 적용' — 12건
- "message:1782650084.848469"    # HT-102·HT-94 양쪽에 연결된 긴 스레드 (전파로 12건 기여)
- "message:1783072186.688439"    # "글로벌 검색 pr 날렸어" — HT-102
- "message:1782459001.061119"    # "ai-engine 수정해서 pr 날렸어" — HT-94

# summary에 담겨야 할 핵심 사실 (LLM-judge가 판정)
# 수치를 요구하는 이유: 질문이 "가장 많이 연결된"이므로 그 수가 곧 답의 실질이다.
expected_facts:
- "관련 대화가 가장 많이 연결된 이슈는 HT-102 '글로벌 검색 추가'와 HT-94 'ai-engine 최적화'이며, 둘 다 13건으로 공동 1위다"

# 오염 감지 — 등장하면 감점
expected_absent:
  facts:
    - "HT-102 또는 HT-94 중 하나만 단독 1위라는 서술 — 둘 다 13건으로 동률이다"
    - "논의 수치를 '댓글 수'나 '논의 횟수'로 서술 — 연결된 메시지 수이며 한 스레드가 여러 건으로 세어진다"

# 케이스별 규칙 검사 (judge가 판정, 기계적으로 확인 가능한 수준으로만)
# ※ 내부 용어 노출은 기계 채점(internal_terms_detected)에서도 전 케이스 공통으로 집계된다.
rule_checks:
- "summary·unknown_aspects에 도구 결과 필드명(discussion_count·duration_days 등)이 등장하지 않는다"
- "summary·unknown_aspects에 그래프 관계 타입(DISCUSSED_IN)·노드 라벨(Communication)·도구 이름(rank_issues)이 등장하지 않는다"
- "논의량 수치를 제시한다면 그 값이 13이다"
