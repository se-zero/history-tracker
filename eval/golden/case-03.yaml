# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement-plan.md 참고.
id: case-03
question: "HT-26 '그래프 생성' 작업의 배경과 변경 내용을 알려줘"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# 반드시 인용돼야 할 근거 = recall 분모. 형식 "{type}:{id}"
#   commit -> hash 앞 7자 / pull_request -> #번호 / issue -> issue_key / message -> conversation_id(루트 ts)
#   리플라이 ts 등 변형이 섞이면 객체 형태로 aliases 사용:
#     - id: "message:1778586053.322069"
#       aliases: ["message:1778590761.356869"]
expected_evidence_ids: 
- "issue:HT-26"
- "pull_request:#15"           # 작업 컨테이너 PR (그래프상 이슈 직접엣지 없음 → acceptable로 내려도 무방)
- "commit:e9e717a"             # Neo4j 그래프 빌더 구현 + 이벤트 핸들러 연결
- "commit:c9338b0"             # ReferenceStore Neo4j 구현 (REFERENCE 엣지)
- "commit:71c0aef"             # 방안 A — 임베딩 유사도 기반 Issue 연결
- "commit:c7d3415"             # 방안 C — conversation_id 기반 DISCUSSED_IN 전파
- "commit:e204386"             # 방안 D — LLM 검증으로 Issue 연결 정확도 향상
# 인용해도 감점하지 않는 추가 근거 (HT-26에 연결됐지만 주변부 변경)
acceptable_evidence_ids:
- "commit:fe5ba81"             # ai-engine 컨슈머 안정성·처리속도 개선 (부수)
- "commit:ea334e9"             # pipeline-worker 정규화 정합성 fix
- "commit:e6eeb98"             # Actor 동일인 판단·GitHub 브랜치 옵션 (주변부)
- "commit:8a2657a"             # GitHub branch 옵션 테스트
- "commit:9716a80"             # .gitignore/.env.example 정리 (chore)
# ⚠ 머지 커밋 3bae1d5·8acdcd7·b256296 은 그래프에 ChangeSet 노드가 없음 — 인용 대상 아님

# summary에 담겨야 할 핵심 사실 (LLM-judge가 판정)
expected_facts: []

# 오염 감지 — 등장하면 감점
expected_absent:
  evidence_ids: []   # 인용되면 안 되는 근거 (알려진 잘못된 엣지가 끌어오는 노드)
  facts:             # summary에 담기면 안 되는 사실 (근거 없는 추론)
    - "HT-26 그래프 생성 방식(방안 A/C/D)을 그렇게 정한 도입 배경·이유 — 슬랙에 논의 없음(오프라인), 지어내면 감점"

# 케이스별 기계 채점 (키워드·필드 존재 검사 수준)
rule_checks:
- "unknown_aspects에 'HT-26 그래프 생성 방식의 결정 배경은 그래프에서 확인되지 않음' 취지 항목 존재"
