# 케이스별 기계 채점 (시간축 — 스코프 격리 + 순서)
rule_checks:
- "summary가 LLM 요약(4/9) → Slack 2단계 필터링(4/17) → 프로젝트 컨텍스트 주입(4/29) 순서를 유지"
- "summary가 2026년 4월 범위 밖의 작업을 서준수의 4월 활동으로 서술하지 않음"
- "evidence의 커밋이 모두 서준수가 작성한 것 (정세영 커밋 혼입 없음)"
