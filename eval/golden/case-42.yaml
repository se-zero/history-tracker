# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement.md 참고.
# [시간축 — 사람 스코프 + 기간] 한 사람의 활동을 기간으로 잘라 시간순 조회.
#   get_actor_activity는 from_time만 있고 to_time이 없어 '4월만'을 자를 수 없다.
#   서준수 2026-04 = 25 이벤트. 같은 달 정세영은 RabbitMQ·Rate Limiter 작업(다른 축)이라
#   스코프가 새면 오염 검사에 걸린다.
id: case-42
question: "서준수가 2026년 4월에 어떤 작업들을 했어? 시간순으로 알려줘."

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# issue -> jira_key, message -> conversation_id(루트 ts), pull_request -> #번호, commit -> hash 앞 7자
# 4월 활동의 3개 축(LLM 요약 / Slack 필터링 / 프로젝트 컨텍스트 주입)의 대표 근거.
expected_evidence_ids:
- "commit:9e7a753"               # 2026-04-09 LLM 기반 diff 요약 파이프라인 구현
- "pull_request:#5"              # 2026-04-09 Feat/llm summery (9e7a753 포함)
- "issue:HT-22"                  # Slack 데이터 전처리 — 4/11 생성, 4/29 완료
- "commit:79dcae4"               # 2026-04-17 Slack 룰 기반 + LLM 2단계 필터링 구현
- "pull_request:#8"              # 2026-04-17 Slack 2단계 필터링 파이프라인 PR

# 인용 무방 — 서준수의 4월 나머지 활동
