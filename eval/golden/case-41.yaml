# summary에 담겨야 할 핵심 사실 (LLM-judge가 판정)
expected_facts:
- "가장 먼저 만들어진 Jira 이슈는 2026년 3월 12일의 HT-1(jira 데이터 생성)과 HT-2(그래프 노드/엣지 정의)다"
- "첫 커밋은 2026년 3월 17일 1739b7a 'init: project structure setup'이다"
- "첫 PR은 #1 'Feature/infra'로 2026년 3월 23일 열리고 같은 날 머지됐다"
- "초기 작업은 Jira 이슈 정의 → 데이터 수집(GitHub·Jira·Slack raw data) → 공통 포맷 정규화 순으로 진행됐다"

# 오염 감지 — 등장하면 감점
expected_absent:
  facts:
    - "프로젝트가 2026년 3월 12일보다 이른 시점에 시작됐다 — 그래프의 최초 이벤트는 HT-1 생성(2026-03-12T17:42)이다"
    - "HT-1 또는 HT-2가 프로젝트 초기가 아닌 후반 작업이라는 서술"
    - "첫 커밋이 첫 이슈 생성보다 먼저였다는 서술 — 이슈(3/12)가 커밋(3/17)보다 5일 앞선다"

# 케이스별 기계 채점 (시간축 — 순서·라벨 정확도)
rule_checks:
- "summary가 이슈 생성(3/12) → 첫 커밋(3/17) → 첫 PR(3/23) 순서를 시간 역전 없이 서술"
- "HT-1·HT-2를 '생성'으로 서술하고 '완료'와 뒤바꾸지 않음 (HT-1 생성 3/12, 완료 3/15)"
- "summary가 최소 3개 이상의 서로 다른 시점을 날짜와 함께 제시"
