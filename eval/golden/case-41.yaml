- "issue:HT-17"                  # 그래프 연결 예시 작성
- "issue:HT-18"                  # 데이터 포맷 변경에 따른 재정규화
- "commit:7d711ea"               # backend 초기 Gradle 설정
- "commit:3a4a7ec"               # 초기 Gradle 설정
- "commit:fabce0a"               # github 데이터 가져오기 (raw data)
- "commit:81314d2"               # jira 데이터 가져오기 (raw data)
- "commit:8ab65c5"               # slack 데이터 가져오기 (raw data)
- "commit:982135c"               # slack 데이터 가져오기 (raw data)
- "commit:60d2d92"               # 기본적인 도커 설정
- "commit:da56f8e"               # 지식그래프 시스템 기초 작성
