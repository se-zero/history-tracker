# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement.md 참고.
# [시간축 — 기간 스코프] from/to로 좁힌 창 안에서 4개 소스를 교차해 순서를 세워야 한다.
#   현행 get_recent_activity는 n.occurredAt 하나만 봐서 이슈의 생성·완료가 안 갈리고
#   PR이 열린 시점을 잃는다. 이 창은 그 손실이 그대로 드러난다:
#     6/12 00:30 Slack 문제 제기 → 6/12~13 커밋 10건 → 6/13 08:23 PR #34 open, 09:25 merge
#     → HT-69 생성 6/12 18:51 / 완료 6/13 17:35, HT-72·73·74는 6/13 14:46 생성 후 5~7분 만에 완료
id: case-44
question: "2026년 6월 12일부터 13일 사이에 멀티턴 대화 기능이 어떤 순서로 만들어졌어?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# issue -> jira_key, message -> conversation_id(루트 ts), pull_request -> #번호, commit -> hash 앞 7자
expected_evidence_ids:
- "message:1781224211.716939"    # 2026-06-12T00:30 발단 — "이전 대화기록 참고 안하고 대답한다"
- "commit:3e1d00e"               # 2026-06-12T11:19 AI 엔진 멀티턴 대화 이력 입력 지원 (첫 구현)
- "pull_request:#34"             # Feat/session memory (HT-69, HT-72, HT-73, HT-74)
- "issue:HT-69"                  # 질의-응답 방식 멀티턴으로 변경 — 6/12 18:51 생성, 6/13 17:35 완료

# 인용 무방 — 같은 창의 나머지 커밋·이슈
acceptable_evidence_ids:
- "issue:HT-72"                  # 멀티턴 대화 이력 입력·전달 (베이스라인)
- "issue:HT-73"                  # 후속 질문 맥락 강화 (구조화 근거 재사용)
- "issue:HT-74"                  # 긴 대화 대응 (누적 요약 + 조회 최적화)
- "commit:c4d98c7"               # 백엔드에서 이전 대화 이력을 AI 엔진에 전달
- "commit:5a5100e"               # AI 대화 이력을 최근 5개 완성 턴으로 제한
- "commit:5add145"               # 현재 질의의 도구 결과만 답변 근거로 사용
- "commit:5715fca"               # AI 구조화 응답을 메시지 메타데이터에 저장
- "commit:7ee48b6"               # 후속 질문 해석을 위한 이전 근거 정보 전달
- "commit:8cdb0cc"               # 긴 대화를 위한 누적 요약 저장 및 전달
- "commit:139e917"               # 누적 요약 커서 기반 대화 이력 조회 최적화
- "commit:d0d9093"               # 멀티턴 대화 문맥 회귀 검증 및 DB 문서 최신화
- "commit:577b0c9"               # 테스트 실패지점 수정

# summary에 담겨야 할 핵심 사실 (LLM-judge가 판정)
expected_facts:
- "6월 12일 새벽 슬랙에서 'AI가 이전 대화기록을 참고하지 않고 대답한다'는 문제 제기로 시작됐다"
- "mem0 같은 전 세션 장기기억보다 한 대화 세션 안의 이전 맥락을 먼저 구현하기로 정했다"
- "6월 12~13일에 걸쳐 대화 이력 입력·전달, 최근 5개 턴 제한, 누적 요약 저장, 커서 기반 조회 최적화가 구현됐다"
- "구현 커밋들은 PR #34 'Feat/session memory'로 6월 13일에 머지됐다"

# 오염 감지 — 등장하면 감점
expected_absent:
  facts:
    - "PR #34가 6월 12일에 머지됐다 — 실제 open·merge는 모두 6월 13일이다"
    - "HT-72·HT-73·HT-74가 구현보다 먼저 생성됐다 — 세 이슈는 6/13 14:46에 생성돼 커밋 대부분보다 나중이다"
    - "멀티턴 기능이 mem0 기반 장기기억으로 구현됐다 — 슬랙에서 우선순위를 세션 내 맥락으로 정했다"

# 케이스별 기계 채점 (시간축 — 창 경계 + 소스 교차 순서)
rule_checks:
- "summary가 슬랙 문제 제기(6/12) → 커밋 구현 → PR #34 머지(6/13) 순서를 시간 역전 없이 서술"
- "summary가 2026년 6월 12~13일 창 밖의 작업을 이 기간의 작업으로 서술하지 않음"
- "evidence에 message와 commit이 모두 존재 (발단과 구현이 함께 인용됨)"
