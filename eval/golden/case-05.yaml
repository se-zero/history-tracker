# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement-plan.md 참고.
id: case-05
question: "HT-46 'GraphRAG 답변 품질 개선'은 어떤 하위 작업들로 진행됐어?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# 반드시 인용돼야 할 근거 = recall 분모. 형식 "{type}:{id}"
#   commit -> hash 앞 7자 / pull_request -> #번호 / issue -> issue_key / message -> conversation_id(루트 ts)
#   리플라이 ts 등 변형이 섞이면 객체 형태로 aliases 사용:
#     - id: "message:1778586053.322069"
#       aliases: ["message:1778590761.356869"]
# 질문이 "어떤 하위 작업들로 진행됐어" → 하위 이슈(descendants) 열거가 곧 정답.
# recall이 곧 descendants 순회 성공 여부를 잰다 (case-2/HT-3 실패모드 가드).
expected_evidence_ids:
- "issue:HT-46"                    # 부모 이슈
- "issue:HT-47"                    # 하위: 이슈-커밋 연결(TRIGGERED_BY) 정확도 개선
- "issue:HT-48"                    # 하위: 쿼리 결과 후처리 — PR cross-product 제거
- "issue:HT-49"                    # 하위: LLM 환각 방지 — Structured Output
- "issue:HT-50"                    # 하위: 검색 fallback — 파일 fuzzy 매칭·모호 질의
- "issue:HT-52"                    # 하위: 전체 재테스트

# 인용해도 감점하지 않는 추가 근거 (각 하위작업의 구현 커밋 — 인용 좋지만 필수 아님)
acceptable_evidence_ids:
- "pull_request:#25"               # 품질 개선 구현 PR (컨테이너)
- "commit:16879e4"                 # HT-47 이슈-커밋 연결 정확도
- "commit:2913ee2"                 # HT-49 Structured Output 환각 차단
- "commit:8e0e895"                 # HT-50 검색 fallback fuzzy 매칭
- "commit:bb8f920"                 # Slack 응답 스레드 경계 보존
- "commit:da7f820"                 # GraphRAG 쿼리 품질 분석 문서

# summary에 담겨야 할 핵심 사실 (하위작업 제목 기반) — 문구 검증 후 확정
expected_facts:
- "이슈-커밋 연결(TRIGGERED_BY) 정확도를 개선했다 (HT-47)"
- "Structured Output으로 LLM 환각을 차단했다 (HT-49)"
- "검색 fallback으로 파일 fuzzy 매칭·모호 질의 진입점을 보강했다 (HT-50)"
- "쿼리 결과 후처리로 PR cross-product를 제거했다 (HT-48)"
- "전체 재테스트로 마무리했다 (HT-52)"

# 오염 감지 — 등장하면 감점
expected_absent:
  evidence_ids:      # HT-46 하위이슈에 오연결된 무관한 슬랙 (내용 확인 후 조정)
    - "message:1777026036.599589"  # 캡스톤디자인 확인서·교수님 이메일 — 완전 무관 (false-positive DISCUSSED_IN)
    - "message:1781224211.716939"  # 멀티턴 대화 맥락 논의 — HT-69 기능, 답변품질 아님
    - "message:1778586053.322069"  # 그래프 생성방안 확정 — HT-26 시기, 답변품질 아님
  facts:             # summary에 담기면 안 되는 사실 (근거 없는 추론)
    - "HT-46 품질 개선의 설계·결정이 슬랙 논의를 통해 이뤄졌다 — 실제 슬랙엔 'pr 날렸어' 공지뿐 관련 논의 없음"

# 케이스별 기계 채점 (descendants 순회 검증 — 핵심)
rule_checks:
- "summary가 하위 이슈 HT-47·48·49·50·52를 열거하고 '하위 작업/연결 없음'류 결론이 없음"
