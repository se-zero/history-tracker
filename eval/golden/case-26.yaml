# 골든셋 케이스 (Stage 1: 단발 질문). 채점 스키마는 docs/measurement-plan.md 참고.
# [단일소스(GitHub) — PR 내용] PR 메시지(제목+본문) + diff 요약만. 다른 소스(슬랙) 불포함.
#   PR #31은 HT-61 단일이슈 링크가 깨끗 → issue:HT-61 인용은 오답 아님(acceptable). 슬랙은 제외.
id: case-26
question: "PR #31은 무슨 변경이야?"

# 일반 질문이면 []. 노드 선택 질문이면 /query 요청 필드 그대로: [{type: issue, id: HT-3}]
focus_evidence: []

# 단일 PR 근거. pull_request -> #번호.
expected_evidence_ids:
- "pull_request:#31"               # Feat/user lifecycle (HT-61)

# 인용해도 감점하지 않는 근거 (PR #31이 실제로 참조하는 이슈 — 슬랙과 달리 정당한 링크)
acceptable_evidence_ids:
- "issue:HT-61"                    # 사용자 계정 탈퇴/복구 lifecycle

# summary에 담겨야 할 핵심 사실 (PR 제목/본문 + diff 요약)
expected_facts:
- "사용자 탈퇴 시 계정을 soft delete로 전환하고, grace period 내 재로그인 시 계정을 복구한다"
- "탈퇴 사용자의 토큰(refresh token) 무효화 등 정리를 포함한다"

# 오염 감지 — 등장하면 감점
expected_absent:
  evidence_ids: []
  facts:
    - "이 PR과 무관한 다른 PR·커밋·슬랙 내용을 이 PR의 변경으로 끌어와 서술"

# 케이스별 기계 채점 (단일소스 + 메시지·diff 모두)
rule_checks:
- "evidence에 message(슬랙) 근거가 없음"
- "summary가 PR 제목·본문과 코드 diff 요약(무엇을 바꿨는지)을 모두 담음"
